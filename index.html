<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flavor Fusion - Nierstein</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: #ff9800;
        }
        .address {
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 0;
            margin-bottom: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-call {
            background-color: #4CAF50;
            color: white;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }
        .btn-menu {
            background-color: #ff9800;
            color: white;
        }
        .btn-paypal {
            background-color: #0070ba;
            color: white;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
        .footer a {
            color: #ff9800;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flavor Fusion</h1>
        <div class="address">
            Mainzer Str. 34<br>
            55283 Nierstein
        </div>
        
        <p>Wählen Sie eine Option / Choose an option:</p>

        <!-- 1. Direct Call -->
        <a href="tel:+49611337089930" class="btn btn-call">📞 Direkt anrufen</a>

        <!-- 2. WhatsApp Chat -->
        <a href="https://wa.me/49611337089930?text=Hallo,%20ich%20möchte%20etwas%20bestellen." class="btn btn-whatsapp" target="_blank">💬 WhatsApp Chat</a>

        <!-- 3. Digital Menu -->
        <a href="menu.pdf" class="btn btn-menu" target="_blank">📖 Unser Menü (Menu)</a>

            Besuchen Sie unsere Website:<br>
            <a href="https://www.restaurant-flavorfusion.de" target="_blank">www.restaurant-flavorfusion.de</a>

</html>
